<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanity Website Starter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">Sanity.io website starter</p>
      <h1>Recent posts</h1>
      <p>
        This page loads post content from a Sanity dataset using a GROQ query.
      </p>
    </header>

    <main>
      <section id="status" class="status" aria-live="polite">Loading…</section>
      <section id="posts" class="posts" aria-label="Post list"></section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
